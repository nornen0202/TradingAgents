<style>
.reader-contents { margin: 16px 0; padding: 12px 16px; border: 1px solid var(--line, #64748b); border-radius: 12px; }

</style><script>
(() => {
  'use strict';
  let serial = 0;
  const rendered = new WeakMap();
  const node = (tag, text) => { const el = document.createElement(tag); if (text != null) el.textContent = text; return el; };
  function inline(parent, text) {
    const pattern = /(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\))/g;
    let start = 0;
    for (const match of String(text).matchAll(pattern)) {
      parent.append(document.createTextNode(text.slice(start, match.index)));
      const value = match[0];
      if (value.startsWith('`')) parent.append(node('code', value.slice(1, -1)));
      else if (value.startsWith('**')) parent.append(node('strong', value.slice(2, -2)));
      else {
        const link = value.match(/^\[([^\]]+)\]\((.+)\)$/);
        const a = node('a', link[1]); a.href = link[2]; a.rel = 'noopener noreferrer'; parent.append(a);
      }
      start = match.index + value.length;
    }
    parent.append(document.createTextNode(text.slice(start)));
  }
  const cells = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(v => v.trim().replace(/\\\|/g, '|'));
  function markdown(source) {
    const article = node('article'); article.className = 'reader-prose';
    const lines = source.split(/\r?\n/); let list = null;
    for (let i = 0; i < lines.length; i += 1) {
      const line = lines[i], value = line.trim();
      if (!value) { list = null; continue; }
      if (/^```/.test(value)) {
        const code = []; i += 1;
        while (i < lines.length && !/^```/.test(lines[i].trim())) code.push(lines[i++]);
        const pre = node('pre'); pre.append(node('code', code.join('\n'))); article.append(pre); list = null; continue;
      }
      if (i + 1 < lines.length && value.includes('|') && cells(lines[i + 1]).every(v => /^:?-{3,}:?$/.test(v))) {
        const table = node('table'), head = node('thead'), body = node('tbody');
        const row = (values, tag) => { const tr = node('tr'); values.forEach(v => { const cell = node(tag); if (tag === 'th') cell.scope = 'col'; inline(cell, v); tr.append(cell); }); return tr; };
        head.append(row(cells(line), 'th')); i += 2;
        while (i < lines.length && lines[i].trim() && lines[i].includes('|')) body.append(row(cells(lines[i++]), 'td'));
        i -= 1; table.append(head, body); article.append(table); list = null; continue;
      }
      const heading = value.match(/^(#{1,6})\s+(.+)$/);
      if (heading) { const h = node('h' + Math.min(4, heading[1].length + 1)); inline(h, heading[2]); article.append(h); list = null; continue; }
      const bullet = value.match(/^(?:[-*+] |\d+\. )(.+)$/);
      if (bullet) {
        const tag = /^\d/.test(value) ? 'ol' : 'ul';
        if (!list || list.tagName.toLowerCase() !== tag) { list = node(tag); if (tag === 'ol') list.start = parseInt(value, 10); article.append(list); }
        const li = node('li'); inline(li, bullet[1]); list.append(li); continue;
      }
      list = null;
      if (/^(---+|\*\*\*+)$/.test(value)) { article.append(node('hr')); continue; }
      const p = node(value.startsWith('> ') ? 'blockquote' : 'p'); inline(p, value.startsWith('> ') ? value.slice(2) : line); article.append(p);
    }
    return article;
  }
  function contents(root) {
    root.querySelectorAll(':scope > .reader-contents').forEach(el => el.remove());
    const headings = [...root.querySelectorAll('h2,h3,h4')].filter(h => !h.closest('.card,.run-card,.reader-contents,[data-reader-source],[hidden]'));
    if (headings.length < 2) return;
    const details = node('details'); details.className = 'reader-contents';
    details.append(node('summary', '이 리포트 목차 · ' + headings.length + '개 항목'));
    const nav = node('nav'); nav.setAttribute('aria-label', '리포트 목차');
    headings.forEach(h => {
      if (!h.id) h.id = 'reader-section-' + (++serial);
      h.dataset.readerHeading = ''; h.tabIndex = -1;
      const a = node('a', h.textContent); a.href = '#' + h.id;
      if (h.tagName !== 'H2') a.className = 'reader-subsection';
      a.addEventListener('click', event => {
        event.preventDefault();
        for (let ancestor = h.parentElement; ancestor; ancestor = ancestor.parentElement) if (ancestor.tagName === 'DETAILS') ancestor.open = true;
        h.scrollIntoView({block: 'start'}); h.focus({preventScroll: true});
      }); nav.append(a);
    });
    details.append(nav); root.prepend(details);
  }
  function enhance(root) {
    if (!root) return;
    root.querySelectorAll('pre[data-report-markdown]').forEach(pre => {
      const previous = rendered.get(pre);
      if (previous && previous.source === pre.textContent) return;
      const article = markdown(pre.textContent);
      if (previous) previous.article.replaceWith(article);
      else {
        const details = node('details'); details.dataset.readerSource = '';
        details.append(node('summary', 'Markdown 원문 보기'));
        pre.before(article, details); details.append(pre);
      }
      rendered.set(pre, {source: pre.textContent, article});
    });
    root.querySelectorAll('table').forEach(table => {
      if (table.closest('.reader-table,.account-table-wrap,.summary-scroll')) return;
      const wrap = node('div'); wrap.className = 'reader-table'; wrap.tabIndex = 0;
      wrap.setAttribute('role', 'region'); wrap.setAttribute('aria-label', '리포트 표 · 가로로 스크롤하여 전체 보기');
      table.before(wrap); wrap.append(table);
    });
    root.querySelectorAll('.grid').forEach(grid => {
      const cards = [...grid.querySelectorAll(':scope > a.card')];
      if (cards.length < 2 || grid.dataset.readerSearch) return;
      grid.dataset.readerSearch = 'true';
      const box = node('div'); box.className = 'reader-search';
      const input = node('input'); input.type = 'search'; input.placeholder = '제목 · 종목 · 채널 · 키워드'; input.id = 'report-search-' + (++serial);
      const label = node('label', '리포트 찾기'); label.htmlFor = input.id;
      const status = node('p'); status.setAttribute('role', 'status'); status.setAttribute('aria-live', 'polite');
      const update = () => {
        const terms = input.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean); let count = 0;
        cards.forEach(card => { card.hidden = !terms.every(t => card.textContent.toLocaleLowerCase().includes(t)); if (!card.hidden) count += 1; });
        status.textContent = cards.length + '개 중 ' + count + '개 표시' + (count ? '' : ' · 검색어를 지우거나 다른 키워드를 입력하세요.');
      };
      input.addEventListener('input', update); box.append(label, input, status); grid.before(box); update();
    });
    contents(root);
  }
  window.TradingAgentsReader = {enhance};
  const main = document.querySelector('main');
  if (main && !main.hasAttribute('data-reader-dynamic')) enhance(main);
  if (main) {
    const top = node('button', '↑ 맨 위'); top.type = 'button'; top.className = 'reader-back'; top.setAttribute('aria-label', '리포트 맨 위로 이동');
    top.addEventListener('click', () => { const target = document.querySelector('h1') || main; target.tabIndex = -1; target.scrollIntoView({block: 'start'}); target.focus({preventScroll: true}); });
    document.body.append(top);
  }
})();
</script>  <script>
  (() => {
    const surfaces = new Set(['kr','us','youtube','prism']);
    const buttons = [...document.querySelectorAll('[data-surface]')];
    const status = document.getElementById('status');
    const report = document.getElementById('report');
    const title = document.getElementById('title');
    const meta = document.getElementById('meta');
    const raw = document.getElementById('raw');
    const summary = document.getElementById('summary');
    const actionsWrap = document.getElementById('actions-wrap');
    const actions = document.getElementById('actions');
    const markdown = document.getElementById('markdown');
    const retry = document.getElementById('retry-report');
    let requestId = 0, controller, selectedSurface = 'kr';
    const labels = {kr:'KR 종합 전략',us:'US 종합 전략',youtube:'YouTube 종합',prism:'PRISM 종합'};

    function localTime(value) {
      if (!value) return '시각 정보 없음';
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? String(value) : new Intl.DateTimeFormat('ko-KR', {dateStyle:'full',timeStyle:'medium',timeZone:'Asia/Seoul'}).format(parsed);
    }
    function plain(value) {
      if (value == null) return '';
      if (typeof value === 'string' || typeof value === 'number') return humanize(String(value));
      if (Array.isArray(value)) return value.map(plain).filter(Boolean).join(' · ');
      if (typeof value === 'object') {
        const keys = ['ticker','display_name','action','stance','readiness','summary','rationale','reason','thesis'];
        const picked = keys.map((key) => value[key]).filter((item) => item != null).map(plain).filter(Boolean);
        return picked.length ? picked.join(' · ') : humanize(JSON.stringify(value, null, 2));
      }
      return String(value);
    }
    function humanize(value) {
      const replacements = new Map([
        ['BLOCKED_STALE','주문 전 실시간 재확인'],['BLOCKED_INCOMPLETE','필수 데이터 재확인'],
        ['NEEDS_LIVE_RECHECK','주문 전 실시간 재확인'],['WAIT_FOR_TRIGGER','조건 충족 대기'],
        ['READY_NOW','현재 조건 확인됨'],['MARKET_CLOSED','개장 후 재확인'],
        ['DATA_OUTAGE','데이터 복구 후 재확인'],['RESEARCH_ONLY','분석 참고 전용'],
        ['NO_ENTRY','신규 진입 보류'],['IMMEDIATE','현재 조건 확인됨'],
        ['COMPLETE','전체 분석 완료'],['DEGRADED','일부 데이터 재확인'],
        ['RESEARCH','분석 참고'],['AVOID','매수 보류'],['WATCH','관찰'],['HOLD','보유'],
        ['STALE','시세 만료'],['MIXED','현재·과거 자료 혼합'],['OK','정상'],
        ['BUY','매수 검토'],['ADD','추가 매수 검토'],['SELL','매도 검토'],['REDUCE','비중 축소'],
        ['confidence','신뢰도'],['sizing','비중 조절'],['execution','실행 판단'],['thesis','투자 논지'],
        ['analysis','분석'],['current','현재'],['run','실행 회차'],['event','이벤트'],
        ['live recheck','실시간 재확인'],['packet','분석 자료'],
        ['RVOL','상대거래량(RVOL)'],['VWAP','거래량가중평균가격(VWAP)'],
      ]);
      let text = String(value || '');
      for (const [machine, investor] of replacements) {
        text = text.replace(new RegExp(`(^|[^A-Z0-9_])${machine}(?=$|[^A-Z0-9_])`, 'g'), (_, prefix) => `${prefix}${investor}`);
      }
      return text;
    }
    function topActionText(item, strategies) {
      const ticker = String((item || {}).ticker || '').trim();
      const strategy = strategies.find((candidate) => String(candidate.ticker || '').trim() === ticker) || {};
      const thesis = strategy.thesis && typeof strategy.thesis === 'object' ? strategy.thesis : {};
      const condition = Array.isArray(thesis.entry_conditions) ? thesis.entry_conditions[0] : thesis.entry_conditions;
      return [ticker, thesis.stance, condition, (item || {}).readiness].map(plain).filter(Boolean).join(' · ');
    }
    async function load(surface) {
      const request = ++requestId;
      selectedSurface = surface;
      if (controller) controller.abort();
      controller = new AbortController();
      const activeController = controller;
      const timer = setTimeout(() => activeController.abort(), 15000);
      buttons.forEach((button) => { const selected = button.dataset.surface === surface; button.setAttribute('aria-selected', String(selected)); button.tabIndex = selected ? 0 : -1; });
      report.setAttribute('aria-labelledby', 'work-tab-' + surface);
      retry.hidden = true;
      status.classList.remove('error');
      status.textContent = `${labels[surface]} 리포트를 불러오는 중입니다.`;
      report.hidden = true;
      const url = `v1/${surface}/report/latest.json`;
      try {
        const response = await fetch(url, {cache:'no-store', credentials:'omit', signal: activeController.signal});
        if (!response.ok) throw new Error('아직 공개된 Work 리포트가 없습니다.');
        const payload = await response.json();
        if (request !== requestId) return;
        const structured = payload.structured_report && typeof payload.structured_report === 'object' ? payload.structured_report : {};
        title.textContent = humanize(structured.title || labels[surface]);
        const asOf = structured.as_of || structured.generated_at;
        meta.textContent = `입력 기준 ${localTime(asOf)} · Work 게시 ${localTime(payload.published_at)}`;
        raw.href = url;
        const summaryText = plain(structured.summary);
        summary.textContent = summaryText;
        summary.hidden = !summaryText;
        const topActions = Array.isArray(structured.top_actions) ? structured.top_actions : [];
        const strategies = Array.isArray(structured.strategies) ? structured.strategies : [];
        actions.replaceChildren(...topActions.map((item) => {
          const li = document.createElement('li');
          li.textContent = topActionText(item, strategies);
          return li;
        }));
        actionsWrap.hidden = topActions.length === 0;
        markdown.textContent = payload.report_markdown || JSON.stringify(structured, null, 2);
        status.textContent = `${labels[surface]} · 공개 리포트 로드 완료`;
        report.hidden = false;
        window.TradingAgentsReader?.enhance(report);
        const next = new URL(location.href);
        next.searchParams.set('surface', surface);
        history.replaceState(null, '', next);
      } catch (error) {
        if (request !== requestId) return;
        status.classList.add('error');
        status.textContent = error.name === 'AbortError' ? '연결 시간이 초과되었습니다. 다시 불러오세요.' : error instanceof Error ? error.message : '리포트를 불러오지 못했습니다.';
        retry.hidden = false;
      } finally {
        clearTimeout(timer);
      }
    }
    retry.addEventListener('click', () => load(selectedSurface));
    buttons.forEach((button, index) => {
      button.addEventListener('click', () => load(button.dataset.surface));
      button.addEventListener('keydown', event => {
        const next = {ArrowRight: (index + 1) % buttons.length, ArrowLeft: (index + buttons.length - 1) % buttons.length, Home: 0, End: buttons.length - 1}[event.key];
        if (next == null) return;
        event.preventDefault(); buttons[next].focus(); load(buttons[next].dataset.surface);
      });
    });
    const requested = new URLSearchParams(location.search).get('surface') || 'kr';
    load(surfaces.has(requested) ? requested : 'kr');
  })();
  </script>
</body>
</html>
