name: Hosted Runner Recovery

on:
  workflow_run:
    workflows:
      - Daily Codex Analysis
      - Intraday Overlay Refresh
      - TradingAgents Mobile Notifications
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed run with a verified hosted runner acquisition failure"
        required: true
        type: string
      dry_run:
        description: "Inspect without requesting a retry"
        default: false
        type: boolean

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: hosted-runner-recovery-${{ github.event.workflow_run.id || inputs.upstream_run_id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main' &&
           contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)) }}
    # Use another hosted OS pool so an Ubuntu allocation incident does not block recovery itself.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted recovery code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Retry only verified unstarted hosted jobs
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || inputs.upstream_run_id }}
          RECOVERY_DRY_RUN: ${{ inputs.dry_run || false }}
        run: python .github/scripts/recover_hosted_runner.py
