name: Scheduled Actions Watchdog

on:
  schedule:
    # Runs cheaply every 15 minutes, offset from common minute 0 load spikes.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect due targets without dispatching recovery runs"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduled-actions-watchdog
  cancel-in-progress: false

jobs:
  dispatch_missing_scheduled_actions:
    runs-on: ubuntu-latest
    concurrency:
      group: tradingagents-official-market-calendar
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve KST market date
        id: market_date
        run: echo "date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore official market calendar cache
        id: restore_market_calendar
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .runtime/market-calendar/kis-open-days.json
          key: official-market-calendar-v1-${{ steps.market_date.outputs.date }}
          restore-keys: |
            official-market-calendar-v1-

      - name: Install market calendar dependency
        run: python -m pip install "exchange-calendars>=4.13.2"

      - name: Dispatch missing scheduled actions
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TRADINGAGENTS_KIS_MARKET_CALENDAR_ENABLED: "1"
          TRADINGAGENTS_KIS_MARKET_CALENDAR_CACHE: .runtime/market-calendar/kis-open-days.json
          TRADINGAGENTS_KIS_MARKET_CALENDAR_TIMEOUT_SECONDS: "15"
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_REF: main
          WATCHDOG_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python .github/scripts/scheduled_actions_watchdog.py

      - name: Save official market calendar cache
        if: ${{ always() && steps.restore_market_calendar.outputs.cache-hit != 'true' && hashFiles('.runtime/market-calendar/kis-open-days.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .runtime/market-calendar/kis-open-days.json
          key: official-market-calendar-v1-${{ steps.market_date.outputs.date }}
