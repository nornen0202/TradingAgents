name: Daily PRISM Telegram Reports

on:
  schedule:
    # After the YouTube add-on window and before the next KR daily run.
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Collection mode: public_preview / bot_api / user_session"
        required: false
        default: "user_session"
        type: choice
        options:
          - public_preview
          - bot_api
          - user_session
      lookback_minutes:
        description: "Lookback window in minutes"
        required: false
        default: "360"
        type: string
      max_messages:
        description: "Maximum Telegram messages to process"
        required: false
        default: "80"
        type: string
      download_pdfs:
        description: "Download PDFs in authenticated modes"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  prepare_self_hosted_runner:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Windows]
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clear stale runner diagnostic logs
        run: |
          $runnerTemp = (Resolve-Path $env:RUNNER_TEMP).Path
          $runnerRoot = Split-Path (Split-Path $runnerTemp -Parent) -Parent
          $diagDirs = @(
            (Join-Path $runnerRoot "_diag\pages"),
            (Join-Path $runnerRoot "_diag\blocks")
          )

          foreach ($diagDir in $diagDirs) {
            if (-not (Test-Path -LiteralPath $diagDir)) {
              Write-Output "Runner diagnostics directory does not exist: $diagDir"
              continue
            }

            $removed = 0
            Get-ChildItem -LiteralPath $diagDir -File -ErrorAction SilentlyContinue | ForEach-Object {
              try {
                Remove-Item -LiteralPath $_.FullName -Force -ErrorAction Stop
                $removed += 1
              } catch {
                Write-Output "::warning::Could not remove $($_.FullName): $($_.Exception.Message)"
              }
            }
            Write-Output "Removed $removed stale runner diagnostic file(s) from $diagDir"
          }

      - name: Reclaim stale self-hosted runner outputs
        run: |
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $prefix = $workspace + [System.IO.Path]::DirectorySeparatorChar
          $staleNamePatterns = @(
            '^portfolio-artifacts$',
            '^analysis-diagnostics(?:-[a-z]+)?$',
            '^source-[0-9]+$',
            '^site(?:-[0-9]+)?$'
          )

          $removed = @()
          Get-ChildItem -LiteralPath $workspace -Force -ErrorAction SilentlyContinue |
            Where-Object {
              $name = $_.Name
              @($staleNamePatterns | Where-Object { $name -match $_ }).Count -gt 0
            } |
            ForEach-Object {
              $candidate = [System.IO.Path]::GetFullPath($_.FullName)
              if (-not $candidate.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "Refusing to clean unsafe runner path: $candidate"
              }
              Remove-Item -LiteralPath $candidate -Recurse -Force -ErrorAction Stop
              $removed += $_.Name
            }
          $freeBytes = (Get-PSDrive -Name C).Free
          Write-Output "Removed stale runner outputs: $(if ($removed) { $removed -join ', ' } else { 'none' })"
          Write-Output ("C: free space after stale-output cleanup: {0:N2} GB" -f ($freeBytes / 1GB))
          if ($freeBytes -lt 2GB) {
            throw "C: free space is below 2GB after stale-output cleanup; refusing to prepare Pages actions."
          }

  build_prism_telegram_pages:
    needs: prepare_self_hosted_runner
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Windows]
    permissions:
      contents: read
    outputs:
      pages_snapshot_generated_epoch_ms: ${{ steps.stamp_pages_snapshot.outputs.generated_epoch_ms }}
    defaults:
      run:
        shell: python {0}
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TRADINGAGENTS_REPO_DIR: ${{ github.workspace }}\source-${{ github.run_id }}
      TRADINGAGENTS_ARCHIVE_DIR: ${{ vars.TRADINGAGENTS_ARCHIVE_DIR }}
      TRADINGAGENTS_PRISM_TELEGRAM_ARCHIVE_DIR: ${{ vars.TRADINGAGENTS_PRISM_TELEGRAM_ARCHIVE_DIR }}
      TRADINGAGENTS_YOUTUBE_ARCHIVE_DIR: ${{ vars.TRADINGAGENTS_YOUTUBE_ARCHIVE_DIR }}
      PRISM_TELEGRAM_PRIVATE_ARCHIVE_DIR: ${{ vars.PRISM_TELEGRAM_PRIVATE_ARCHIVE_DIR }}
      PRISM_TELEGRAM_MODE: ${{ github.event.inputs.mode || vars.PRISM_TELEGRAM_MODE || 'user_session' }}
      PRISM_TELEGRAM_DOWNLOAD_PDFS: ${{ github.event.inputs.download_pdfs || vars.PRISM_TELEGRAM_DOWNLOAD_PDFS || 'true' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      TELEGRAM_SESSION_PATH: ${{ vars.TELEGRAM_SESSION_PATH }}

    steps:
      - name: Initialize PRISM run-scoped temporary path
        shell: pwsh
        run: |
          "TRADINGAGENTS_SITE_DIR=$([System.IO.Path]::Combine($env:RUNNER_TEMP, "tradingagents-site-$env:GITHUB_RUN_ID-prism"))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: source-${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install TradingAgents
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import subprocess
          import sys

          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", "pip"])
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", ".[telegram]"])

      - name: Rebuild base scheduled site
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import os
          import subprocess
          import sys

          args = [
              sys.executable,
              "-u",
              "-m",
              "tradingagents.scheduled",
              "--config",
              "config/scheduled_analysis.toml",
              "--site-only",
              "--site-dir",
              os.environ["TRADINGAGENTS_SITE_DIR"],
          ]
          archive_dir = os.environ.get("TRADINGAGENTS_ARCHIVE_DIR", "").strip()
          if archive_dir:
              args += ["--archive-dir", archive_dir]
          subprocess.check_call(args)

      - name: Run PRISM Telegram report collection
        timeout-minutes: 45
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import os
          import subprocess
          import sys

          lookback_minutes = "${{ github.event.inputs.lookback_minutes }}".strip() or "360"
          max_messages = "${{ github.event.inputs.max_messages }}".strip() or "80"
          mode = os.environ.get("PRISM_TELEGRAM_MODE", "").strip() or "user_session"
          download_pdfs = os.environ.get("PRISM_TELEGRAM_DOWNLOAD_PDFS", "").strip().lower() or "true"

          args = [
              sys.executable,
              "-u",
              "-m",
              "tradingagents.prism_telegram",
              "--config",
              "config/prism_telegram_daily.toml",
              "--mode",
              mode,
              "--lookback-minutes",
              lookback_minutes,
              "--max-messages",
              max_messages,
              "--site-dir",
              os.environ["TRADINGAGENTS_SITE_DIR"],
          ]
          archive_dir = os.environ.get("TRADINGAGENTS_PRISM_TELEGRAM_ARCHIVE_DIR", "").strip()
          if archive_dir:
              args += ["--archive-dir", archive_dir]
          if download_pdfs in {"1", "true", "yes", "on"}:
              args += ["--download-pdfs"]
          subprocess.check_call(args)

      - name: Rebuild merged site and Work context after PRISM collection
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import os
          import subprocess
          import sys

          args = [
              sys.executable,
              "-u",
              "-m",
              "tradingagents.scheduled",
              "--config",
              "config/scheduled_analysis.toml",
              "--site-only",
              "--site-dir",
              os.environ["TRADINGAGENTS_SITE_DIR"],
          ]
          archive_dir = os.environ.get("TRADINGAGENTS_ARCHIVE_DIR", "").strip()
          if archive_dir:
              args += ["--archive-dir", archive_dir]
          subprocess.check_call(args)

      - name: Stamp rollback-resistant Pages snapshot
        id: stamp_pages_snapshot
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import os
          import subprocess
          import sys

          subprocess.check_call(
              [
                  sys.executable,
                  ".github/scripts/pages_snapshot.py",
                  "stamp",
                  "--site-dir",
                  os.environ["TRADINGAGENTS_SITE_DIR"],
                  "--repository",
                  "${{ github.repository }}",
                  "--workflow",
                  "${{ github.workflow }}",
                  "--run-id",
                  "${{ github.run_id }}",
                  "--run-attempt",
                  "${{ github.run_attempt }}",
                  "--commit-sha",
                  "${{ github.sha }}",
                  "--require-strategy-payload",
              ]
          )

      - name: Add Git Bash to PATH for Pages packaging
        if: runner.os == 'Windows'
        shell: python {0}
        run: |
          import os
          from pathlib import Path

          for candidate in (
              Path("C:/Program Files/Git/bin"),
              Path("C:/Program Files/Git/usr/bin"),
          ):
              if (candidate / "bash.exe").is_file():
                  with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
                      handle.write(f"{candidate}\n")
                  break
          else:
              raise SystemExit(
                  "Git Bash not found in expected Git for Windows directories."
              )

      - name: Verify Pages packaging tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash --version
          tar --version

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages-prism-telegram
          path: ${{ env.TRADINGAGENTS_SITE_DIR }}

      - name: Clean run-scoped PRISM files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          import os
          import shutil
          from pathlib import Path

          roots_and_targets = (
              (Path(os.environ["GITHUB_WORKSPACE"]), Path(os.environ["TRADINGAGENTS_REPO_DIR"])),
              (Path(os.environ["RUNNER_TEMP"]), Path(os.environ["TRADINGAGENTS_SITE_DIR"])),
          )
          for allowed_root, target in roots_and_targets:
              allowed_root = allowed_root.resolve()
              target = target.resolve()
              if target == allowed_root or os.path.commonpath([str(target), str(allowed_root)]) != str(allowed_root):
                  raise SystemExit(f"Refusing to clean unsafe run-scoped path: {target}")
              if target.exists():
                  shutil.rmtree(target)
                  print(f"Removed run-scoped path: {target}")

  deploy:
    needs: build_prism_telegram_pages
    if: ${{ needs.build_prism_telegram_pages.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tradingagents-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment guard
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Refuse stale Pages snapshot rollback
        id: pages_guard
        env:
          PAGES_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: >-
          python .github/scripts/pages_snapshot.py guard
          --candidate-generated-epoch-ms "${{ needs.build_prism_telegram_pages.outputs.pages_snapshot_generated_epoch_ms }}"
          --candidate-run-id "${{ github.run_id }}"
          --candidate-run-attempt "${{ github.run_attempt }}"
          --public-base-url "$PAGES_PUBLIC_BASE_URL"

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.pages_guard.outputs.should_deploy == 'true' }}
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-prism-telegram
          timeout: 1800000
          reporting_interval: 10000
