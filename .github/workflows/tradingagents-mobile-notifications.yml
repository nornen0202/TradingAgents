name: TradingAgents Mobile Notifications

on:
  workflow_run:
    workflows:
      - Daily Codex Analysis
      - Intraday Overlay Refresh
      - Account Portfolio Report Verify
      - Daily YouTube Verified Reports
      - Daily PRISM Telegram Reports
      - Work Report Pages Refresh
    types:
      - completed
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed upstream GitHub Actions run ID to inspect and notify"
        required: true
        type: string
      dry_run:
        description: "Compose and validate without contacting Telegram"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: tradingagents-mobile-notification-${{ github.event.workflow_run.id || inputs.upstream_run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      workflow_name: ${{ steps.inspect.outputs.workflow_name }}
      conclusion: ${{ steps.inspect.outputs.conclusion }}
      should_notify: ${{ steps.inspect.outputs.should_notify }}
      reason: ${{ steps.inspect.outputs.reason }}
    steps:
      - name: Check out trusted notifier code from main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Inspect and validate upstream workflow
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || inputs.upstream_run_id }}
        run: >-
          python -m tradingagents.notifications inspect
          --repository "$GITHUB_REPOSITORY"
          --upstream-run-id "$UPSTREAM_RUN_ID"
          --github-output "$GITHUB_OUTPUT"

  notify_remote:
    name: Send remote-safe completion notification
    needs:
      - resolve
    if: ${{ needs.resolve.outputs.should_notify == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tradingagents-mobile-notification-ledger
      cancel-in-progress: false
    steps:
      - name: Check out trusted notifier code from main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Restore deployment Telegram incident ledger
        id: restore_telegram_ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deployment-telegram-notification-ledger.json
          key: deployment-telegram-notification-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deployment-telegram-notification-ledger-v1-

      - name: Initialize Telegram incident ledger on cache miss
        env:
          TELEGRAM_LEDGER_PATH: ${{ runner.temp }}/deployment-telegram-notification-ledger.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["TELEGRAM_LEDGER_PATH"])
          if not path.exists():
              path.write_text(
                  json.dumps(
                      {
                          "schema": "tradingagents.telegram-notification-ledger/v1",
                          "entries": {},
                          "incidents": {},
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Send deployment Telegram completion or failure notification
        id: notify_telegram
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || inputs.upstream_run_id }}
          NOTIFICATION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOYMENT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NOTIFICATION_CHAT_ID: ${{ secrets.DEPLOYMENT_TELEGRAM_NOTIFICATION_CHAT_ID }}
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/no-local-archive"
          mkdir -p "$archive_dir"
          args=(
            -m tradingagents.notifications notify
            --repository "$GITHUB_REPOSITORY"
            --upstream-run-id "$UPSTREAM_RUN_ID"
            --archive-dir "$archive_dir"
            --ledger-path "$RUNNER_TEMP/deployment-telegram-notification-ledger.json"
            --public-base-url "https://nornen0202.github.io/TradingAgents"
          )
          if [[ "$NOTIFICATION_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python "${args[@]}"

      - name: Persist Telegram incident ledger and partial delivery cursor
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deployment-telegram-notification-ledger.json
          key: deployment-telegram-notification-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
