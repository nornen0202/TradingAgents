        with:
          path: overlay-kr-${{ github.run_id }}-${{ github.run_attempt }}
          clean: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Wait for safe Windows resource headroom
        timeout-minutes: 16
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import subprocess
