  publish_overlay_site:
    needs:
      - overlay_refresh_us
      - overlay_refresh_kr
    if: ${{ always() && !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') && (needs.overlay_refresh_us.result == 'success' || needs.overlay_refresh_kr.result == 'success') }}
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    concurrency:
      group: intraday-overlay-publish
      cancel-in-progress: true
    outputs:
      pages_snapshot_generated_epoch_ms: ${{ steps.stamp_pages_snapshot.outputs.generated_epoch_ms }}
    defaults:
      run:
        shell: python {0}
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TRADINGAGENTS_ARCHIVE_DIR: ${{ vars.TRADINGAGENTS_ARCHIVE_DIR }}
      TRADINGAGENTS_PRISM_TELEGRAM_ARCHIVE_DIR: ${{ vars.TRADINGAGENTS_PRISM_TELEGRAM_ARCHIVE_DIR }}
      TRADINGAGENTS_YOUTUBE_ARCHIVE_DIR: ${{ vars.TRADINGAGENTS_YOUTUBE_ARCHIVE_DIR }}
    steps:
      - name: Initialize overlay-pages run-scoped temporary path
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        run: |
          "TRADINGAGENTS_SITE_DIR=$([System.IO.Path]::Combine($env:RUNNER_TEMP, "tradingagents-site-$env:GITHUB_RUN_ID-overlay-pages"))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install TradingAgents
        run: |
          import subprocess
          import sys

          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", "pip"])
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", ".[translation]"])

      - name: Rebuild final merged overlay site
        run: |
          import os
          import subprocess
          import sys

          profile = "${{ github.event.inputs.profile }}".strip()
          schedule = "${{ github.event.schedule }}".strip()
          event_name = "${{ github.event_name }}".strip()
          config_path = "config/scheduled_analysis.toml"
          if event_name == "workflow_dispatch" and profile == "kr":
              config_path = "config/scheduled_analysis_korea.toml"
          if event_name == "schedule" and schedule in {"5 1 * * 1-5", "0 3 * * 1-5", "20 4 * * 1-5"}:
              config_path = "config/scheduled_analysis_korea.toml"

          args = [
              sys.executable,
              "-m",
              "tradingagents.scheduled",
              "--config",
              config_path,
              "--site-only",
              "--site-dir",
              os.environ["TRADINGAGENTS_SITE_DIR"],
          ]
          archive_dir = os.environ.get("TRADINGAGENTS_ARCHIVE_DIR", "").strip()
          if archive_dir:
              args += ["--archive-dir", archive_dir]

          subprocess.check_call(args)

      - name: Add Git Bash to PATH for Pages packaging
        run: |
          import os
          from pathlib import Path

          for candidate in (r"C:\Program Files\Git\bin", r"C:\Program Files\Git\usr\bin"):
              if (Path(candidate) / "bash.exe").exists():
                  github_path = os.environ.get("GITHUB_PATH")
                  if not github_path:
                      raise SystemExit("GITHUB_PATH is unavailable.")
                  with open(github_path, "a", encoding="utf-8") as handle:
                      handle.write(candidate + os.linesep)
                  print(f"Added Git Bash path: {candidate}")
                  break
          else:
              raise SystemExit("bash.exe was not found under the expected Git for Windows directories.")

      - name: Verify final site output directory exists
        run: |
          import os
          from pathlib import Path

          site_dir = Path(os.environ["TRADINGAGENTS_SITE_DIR"])
          if not site_dir.exists():
              raise SystemExit(f"Expected site output directory was not created: {site_dir}")

      - name: Verify stable decision bundle Pages paths
        run: |
          import os
          import subprocess
          import sys

          profile = "${{ github.event.inputs.profile }}".strip()
          schedule = "${{ github.event.schedule }}".strip()
          markets = ["us", "kr"] if profile in {"", "all"} else [profile]
          if schedule in {"5 1 * * 1-5", "0 3 * * 1-5", "20 4 * * 1-5"}:
              markets = ["kr"]
          elif schedule:
              markets = ["us"]
          for market in markets:
              subprocess.check_call([
                  sys.executable,
                  ".github/scripts/verify_decision_bundle.py",
                  "--site-dir",
                  os.environ["TRADINGAGENTS_SITE_DIR"],
                  "--market",
                  market,
              ])

      - name: Stamp rollback-resistant Pages snapshot
        id: stamp_pages_snapshot
        run: |
          import os
          import subprocess
          import sys

          subprocess.check_call(
              [
                  sys.executable,
                  ".github/scripts/pages_snapshot.py",
                  "stamp",
                  "--site-dir",
                  os.environ["TRADINGAGENTS_SITE_DIR"],
                  "--repository",
                  "${{ github.repository }}",
                  "--workflow",
                  "${{ github.workflow }}",
                  "--run-id",
                  "${{ github.run_id }}",
                  "--run-attempt",
                  "${{ github.run_attempt }}",
                  "--commit-sha",
                  "${{ github.sha }}",
                  "--require-strategy-payload",
              ]
          )

      - name: Upload final GitHub Pages artifact
        id: upload_pages_final
        timeout-minutes: 15
        continue-on-error: true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages-overlay
          path: ${{ env.TRADINGAGENTS_SITE_DIR }}

      - name: Retry final GitHub Pages artifact upload after transient network failure
        if: ${{ steps.upload_pages_final.outcome == 'failure' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages-overlay
          path: ${{ env.TRADINGAGENTS_SITE_DIR }}

  deploy_overlay:
    needs:
      - publish_overlay_site
    if: ${{ always() && needs.publish_overlay_site.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tradingagents-pages-deploy
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment guard
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Refuse stale Pages snapshot rollback
        id: pages_guard
        env:
          PAGES_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: >-
          python .github/scripts/pages_snapshot.py guard
          --candidate-generated-epoch-ms "${{ needs.publish_overlay_site.outputs.pages_snapshot_generated_epoch_ms }}"
          --candidate-run-id "${{ github.run_id }}"
          --candidate-run-attempt "${{ github.run_attempt }}"
          --public-base-url "$PAGES_PUBLIC_BASE_URL"

      - name: Deploy overlay refresh site to GitHub Pages
        id: deployment
        if: ${{ steps.pages_guard.outputs.should_deploy == 'true' }}
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-overlay
