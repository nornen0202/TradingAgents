name: Intraday Overlay Refresh
run-name: >-
  Intraday Overlay Refresh
  [profile=${{ inputs.profile || (github.event.schedule == '5 1 * * 1-5' && 'kr') || (github.event.schedule == '0 3 * * 1-5' && 'kr') || (github.event.schedule == '20 4 * * 1-5' && 'kr') || (github.event_name == 'schedule' && 'us') || 'all' }}]
  [run_mode=${{ inputs.run_mode || 'overlay_only' }}]
  [request_scope=${{ inputs.tickers && 'custom_tickers' || 'default_universe' }}]
  [recovery_source=${{ inputs.recovery_source || (github.event_name == 'schedule' && 'native') || 'manual' }}]

on:
  schedule:
    # KR overlay starts: 10:05, 12:00, 13:20 KST.
    # Target deploys are roughly 11:05, 13:00, and before 14:30 KST.
    - cron: '5 1 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '20 4 * * 1-5'
    # US overlay starts: 22:40, 00:40, 02:10 KST for the active US session.
    # Target deploys are roughly 23:30, 01:30, and by 03:00 KST.
    - cron: '40 13,15 * * 1-5'
    - cron: '10 17 * * 1-5'
  workflow_dispatch:
    inputs:
      profile:
        description: "Run profile: us / kr / all (default all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - us
          - kr
      run_mode:
        description: "overlay_only / selective_rerun_only"
        required: false
        default: "overlay_only"
        type: choice
        options:
          - overlay_only
          - selective_rerun_only
      tickers:
        description: "Optional comma-separated tickers override"
        required: false
        type: string
      recovery_source:
        description: "Dispatch origin marker used for retry and notification policy"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - cloud_watchdog
          - local_watchdog

env:
  TRADINGAGENTS_RECOVERY_SOURCE: ${{ inputs.recovery_source || (github.event_name == 'schedule' && 'native') || 'manual' }}

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  overlay_gate:
    runs-on: ubuntu-latest
    concurrency:
      group: tradingagents-official-market-calendar
      cancel-in-progress: false
    outputs:
      run_us: ${{ steps.gate.outputs.run_us }}
      run_kr: ${{ steps.gate.outputs.run_kr }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve official market calendar cache date
        id: market_calendar_date
        run: echo "date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore official market calendar
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .runtime/market-calendar/kis-open-days.json
          key: tradingagents-official-market-calendar-v1-${{ steps.market_calendar_date.outputs.date }}
          restore-keys: |
            tradingagents-official-market-calendar-v1-
      - name: Install exchange calendar gate dependency
        run: python -m pip install --disable-pip-version-check "exchange-calendars>=4.13.2"
      - name: Require a successful research baseline from the last 24 hours
        id: gate
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_PROFILE: ${{ github.event.inputs.profile }}
          TRADINGAGENTS_KIS_MARKET_CALENDAR_ENABLED: "1"
          TRADINGAGENTS_MARKET_CALENDAR_CACHE_PATH: .runtime/market-calendar/kis-open-days.json
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_Developers_APP_KEY: ${{ secrets.KIS_Developers_APP_KEY }}
          KIS_Developers_APP_SECRET: ${{ secrets.KIS_Developers_APP_SECRET }}
          KIS_HTTP_TIMEOUT_SECONDS: "8"
        run: python .github/scripts/intraday_overlay_gate.py
      - name: Check official market calendar cache freshness
        id: market_calendar_ready
        if: ${{ always() }}
        run: python .github/scripts/market_calendar_cache_status.py
      - name: Persist official market calendar
        if: ${{ always() && steps.market_calendar_ready.outputs.fresh == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .runtime/market-calendar/kis-open-days.json
          key: tradingagents-official-market-calendar-v1-${{ steps.market_calendar_date.outputs.date }}

  overlay_refresh_us:
    needs:
      - overlay_gate
    if: ${{ needs.overlay_gate.outputs.run_us == 'true' }}
    # A dedicated producer is opt-in; never borrow the Pages runner implicitly.
    runs-on: ${{ fromJSON(((inputs.run_mode || 'overlay_only') == 'overlay_only' && vars.TRADINGAGENTS_OVERLAY_RUNNER_LABELS) || '["self-hosted", "Windows"]') }}
    timeout-minutes: 120
    concurrency:
      group: tradingagents-overlay-producer-us
      cancel-in-progress: false
    defaults:
      run:
        shell: python {0}
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TRADINGAGENTS_REPO_DIR: ${{ github.workspace }}\overlay-us-${{ github.run_id }}-${{ github.run_attempt }}
      TRADINGAGENTS_OVERLAY_RUN_LABEL: github-actions-overlay-us-${{ github.run_id }}-${{ github.run_attempt }}
      REQUESTED_RUN_MODE: ${{ inputs.run_mode || 'overlay_only' }}
      REQUESTED_TICKERS: ${{ inputs.tickers }}
      TRADINGAGENTS_ARCHIVE_DIR: ${{ vars.TRADINGAGENTS_ARCHIVE_DIR }}
      TRADINGAGENTS_PRISM_TELEGRAM_ARCHIVE_DIR: ${{ vars.TRADINGAGENTS_PRISM_TELEGRAM_ARCHIVE_DIR }}
      TRADINGAGENTS_YOUTUBE_ARCHIVE_DIR: ${{ vars.TRADINGAGENTS_YOUTUBE_ARCHIVE_DIR }}
      CODEX_BINARY: ${{ vars.CODEX_BINARY }}
      CODEX_HOME: ${{ vars.CODEX_HOME }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_DATA_FEED: ${{ secrets.ALPACA_DATA_FEED }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_PRODUCT_CODE: ${{ secrets.KIS_PRODUCT_CODE }}
      KIS_Developers_APP_KEY: ${{ secrets.KIS_Developers_APP_KEY }}
      KIS_Developers_APP_SECRET: ${{ secrets.KIS_Developers_APP_SECRET }}
      KIS_Developers_ACCOUNT_NO: ${{ secrets.KIS_Developers_ACCOUNT_NO }}
      KIS_Developers_PRODUCT_CODE: ${{ secrets.KIS_Developers_PRODUCT_CODE }}
      KIS_HTTP_TIMEOUT_SECONDS: "8"
      TRADINGAGENTS_OVERLAY_MAX_WORKERS: "4"
      TRADINGAGENTS_OVERLAY_TICKER_TIMEOUT_SECONDS: "45"

    steps:
      - name: Initialize overlay-us run-scoped temporary path
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        run: |
          "TRADINGAGENTS_SITE_DIR=$([System.IO.Path]::Combine($env:RUNNER_TEMP, "tradingagents-site-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-overlay-us"))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRADINGAGENTS_OVERLAY_VENV_DIR=$([System.IO.Path]::Combine($env:RUNNER_TEMP, "tradingagents-venv-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-overlay-us"))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay-us-${{ github.run_id }}-${{ github.run_attempt }}
          clean: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Wait for safe Windows resource headroom
        timeout-minutes: 16
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import subprocess
          import sys

          subprocess.check_call([sys.executable, ".github/scripts/windows_resource_guard.py"])

      - name: Install TradingAgents in run-scoped virtual environment
        timeout-minutes: 15
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          venv_dir = Path(os.environ["TRADINGAGENTS_OVERLAY_VENV_DIR"])
          subprocess.check_call([sys.executable, "-m", "venv", str(venv_dir)])
          venv_python = str(venv_dir / "Scripts" / "python.exe")
          subprocess.check_call([venv_python, "-m", "pip", "install", "-e", ".[translation]"])

      - name: Run overlay refresh mode
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import os
          from pathlib import Path
          import subprocess

          config_path = "config/scheduled_analysis.toml"
          if not Path(config_path).exists():
              raise SystemExit("Missing config/scheduled_analysis.toml.")

          run_mode = os.environ.get("REQUESTED_RUN_MODE", "").strip() or "overlay_only"
          if run_mode not in {"overlay_only", "selective_rerun_only"}:
              raise SystemExit("Unsupported overlay run mode.")
          venv_python = str(Path(os.environ["TRADINGAGENTS_OVERLAY_VENV_DIR"]) / "Scripts" / "python.exe")
          args = [
              venv_python,
              "-m",
              "tradingagents.scheduled",
              "--config",
              config_path,
              "--run-mode",
              run_mode,
              "--site-dir",
              os.environ["TRADINGAGENTS_SITE_DIR"],
              "--label",
              os.environ["TRADINGAGENTS_OVERLAY_RUN_LABEL"],
              "--skip-site-build",
              "--strict",
          ]

          archive_dir = os.environ.get("TRADINGAGENTS_ARCHIVE_DIR", "").strip()
          if not archive_dir or not Path(archive_dir).is_absolute() or not Path(archive_dir).is_dir():
              raise SystemExit("An existing absolute TRADINGAGENTS_ARCHIVE_DIR is required for the shared baseline.")
          if Path(archive_dir).resolve().is_relative_to(Path(os.environ["TRADINGAGENTS_REPO_DIR"]).resolve()):
              raise SystemExit("The shared archive must be outside the disposable checkout.")
          args += ["--archive-dir", archive_dir]

          manual_tickers = os.environ.get("REQUESTED_TICKERS", "").strip()
          if manual_tickers:
              args += ["--tickers", manual_tickers]

          subprocess.check_call(args)

      - name: Validate US decision bundle quality
        working-directory: ${{ env.TRADINGAGENTS_REPO_DIR }}
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess

          archive_dir = os.environ["TRADINGAGENTS_ARCHIVE_DIR"].strip()
          venv_python = str(Path(os.environ["TRADINGAGENTS_OVERLAY_VENV_DIR"]) / "Scripts" / "python.exe")
          label = os.environ["TRADINGAGENTS_OVERLAY_RUN_LABEL"]
          if not re.fullmatch(r"github-actions-overlay-us-[0-9]+-[0-9]+", label):
              raise SystemExit("Invalid overlay job label.")
          runs_root = (Path(archive_dir) / "runs").resolve()
          matches = [path for path in runs_root.glob("*/*_" + label)
                     if path.is_dir() and path.resolve().is_relative_to(runs_root)]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one completed run for this overlay job; found {len(matches)}.")
          subprocess.check_call([
              venv_python,
              ".github/scripts/verify_decision_bundle.py",
              "--run-dir",
              str(matches[0]),
          ])

      - name: Clean run-scoped overlay-us files
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          import os
          from pathlib import Path
          import shutil
          import stat

          run_id, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          if not run_id.isdigit() or not attempt.isdigit():
              raise SystemExit("Refusing unsafe run identity for cleanup.")
          suffix = run_id + "-" + attempt
          targets = []
          for key, parent_key, name in (
              ("TRADINGAGENTS_REPO_DIR", "GITHUB_WORKSPACE", "overlay-us-" + suffix),
              ("TRADINGAGENTS_OVERLAY_VENV_DIR", "RUNNER_TEMP", "tradingagents-venv-" + suffix + "-overlay-us"),
              ("TRADINGAGENTS_SITE_DIR", "RUNNER_TEMP", "tradingagents-site-" + suffix + "-overlay-us"),
          ):
              value, parent_value = os.environ.get(key, ""), os.environ.get(parent_key, "")
              if not value:
                  continue
              if not parent_value:
                  raise SystemExit("Refusing cleanup without its allowed parent.")
              target, parent = Path(value).resolve(), Path(parent_value).resolve()
              if parent == Path(parent.anchor) or target.parent != parent or target.name != name:
                  raise SystemExit("Refusing unsafe run-scoped path cleanup.")
              targets.append(target)
          def clear_readonly(function, path, exception):
              os.chmod(path, stat.S_IWRITE)
              function(path)
          for target in targets:
              if target.exists():
                  shutil.rmtree(target, onexc=clear_readonly)

