name: Publish AI Context Mirror
run-name: >-
  Publish AI Context Mirror
  [upstream=${{ github.event.workflow_run.id || inputs.upstream_run_id || 'manual' }}]
  [attempt=${{ github.event.workflow_run.run_attempt || inputs.upstream_run_attempt || '1' }}]

on:
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed producer run ID for followup provenance"
        required: false
        type: string
      upstream_run_attempt:
        description: "Upstream attempt for followup provenance"
        required: false
        default: "1"
        type: string
  workflow_run:
    workflows: [Daily Codex Analysis, Intraday Overlay Refresh, Daily YouTube Verified Reports, Daily PRISM Telegram Reports, Work Report Pages Refresh]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tradingagents-public-ai-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: vars.TRADINGAGENTS_AUTOMATION_BACKEND != 'local' && github.repository == 'nornen0202/TradingAgents' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Mirror only hash-verified public AI readers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_ai_context.py
